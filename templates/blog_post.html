<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} - Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5 mb-5" style="max-width: 800px;">
        <a href="{{ url_for('blog_list') }}" class="btn btn-outline-secondary mb-4">&larr; Back to Blog</a>
        <h1 class="fw-bold">{{ post.title }}</h1>
        <p class="text-muted">{{ post.created_at.strftime('%B %d, %Y') }}</p>
        
        {% if post.cover_image %}
        <img src="{{ url_for('static', filename='uploads/' + post.cover_image) }}" class="img-fluid rounded mb-4" alt="{{ post.title }}">
        {% endif %}
        
        <div class="content" style="font-size: 1.1rem; line-height: 1.8;">
            {{ post.content | safe }}
        </div>
    </div>
</body>
</html>
