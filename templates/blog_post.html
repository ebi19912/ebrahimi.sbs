<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} - Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container mt-5 mb-5" style="max-width: 800px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="{{ url_for('blog_list') }}" class="btn btn-outline-secondary">&larr; Back to Blog</a>
            <a href="/" class="btn btn-outline-primary"><i class="bi bi-house-door"></i> Home</a>
        </div>
        
        {% if not post.is_published %}
        <div class="alert alert-warning d-flex align-items-center mb-4">
            <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i>
            <div>
                <strong>Admin Preview:</strong> This post is currently set to <strong>Draft</strong> and is not visible to public visitors.
            </div>
        </div>
        {% endif %}
        
        <h1 class="fw-bold">{{ post.title }}</h1>
        <p class="text-muted">{{ post.created_at.strftime('%B %d, %Y') }}</p>
        
        {% if post.cover_image %}
        <img src="{{ url_for('static', filename='uploads/' + post.cover_image) }}" class="img-fluid rounded mb-4" alt="{{ post.title }}">
        {% endif %}
        
        <div class="content" style="font-size: 1.1rem; line-height: 1.8;">
            {{ post.content | safe }}
        </div>
    </div>
</body>
</html>
