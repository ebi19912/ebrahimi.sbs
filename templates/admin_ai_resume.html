<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Resume Strategist</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex flex-column align-items-center justify-content-center" style="height: 100vh;">

    <div class="container mt-3" style="max-width: 600px;">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
                <strong>{{ message }}</strong>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
    </div>

    <div class="card shadow-lg p-4 border-0" style="max-width: 600px; width: 100%; border-radius: 15px;">
        <div class="text-center mb-4">
            <i class="bi bi-cpu text-primary" style="font-size: 3rem;"></i>
            <h3 class="fw-bold mt-2">AI Resume Strategist</h3>
            <p class="text-muted">Paste the JD below. I'll select the best projects and rewrite them for you.</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <textarea name="job_description" class="form-control bg-light" rows="8" placeholder="Paste Job Description..." required style="border-radius: 10px;"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow-sm">
                Analyze & Build <i class="bi bi-arrow-right"></i>
            </button>
        </form>
        <div class="text-center mt-4">
            <a href="{{ url_for('admin_dashboard') }}" class="text-decoration-none text-secondary small">Back to Dashboard</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
