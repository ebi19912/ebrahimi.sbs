<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Edit' if item else 'Add' }} Resume Item</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.tiny.cloud/1/w8vr6yt43j2ye3rljgb50iljf8vpzb3iy2kclr4yc11xk5tb/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
    <script>
      tinymce.init({
        selector: '#description',
        plugins: 'lists link code help wordcount',
        toolbar: 'undo redo | bold italic | bullist numlist | link | code',
        height: 250
      });
    </script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="mb-4">{{ 'Edit' if item else 'Add New' }} Resume Item</h2>
            
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select" required>
                            <option value="education" {% if item and item.category == 'education' %}selected{% endif %}>Education</option>
                            <option value="work" {% if item and item.category == 'work' %}selected{% endif %}>Work Experience</option>
                            <option value="honor" {% if item and item.category == 'honor' %}selected{% endif %}>Honor / Award</option>
                            <option value="paper" {% if item and item.category == 'paper' %}selected{% endif %}>Paper / Publication</option>
                        </select>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Duration / Date</label>
                        <input type="text" name="duration" class="form-control" value="{{ item.duration if item else '' }}" placeholder="e.g. 2020 - Present">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Title / Degree / Position</label>
                    <input type="text" name="title" class="form-control" value="{{ item.title if item else '' }}" placeholder="e.g. Senior Developer" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Organization / University</label>
                    <input type="text" name="organization" class="form-control" value="{{ item.organization if item else '' }}" placeholder="e.g. Google" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description (Optional)</label>
                    <textarea id="description" name="description">{{ item.description if item else '' }}</textarea>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-success">Save Item</button>
                    <a href="{{ url_for('admin_resume_list') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
<!-- Scroll to Top Button -->
<button id="scrollToTopBtn" title="Go to top" style="display: none; position: fixed; bottom: 20px; right: 20px; z-index: 9999; border: none; outline: none; background-color: #007bff; color: white; cursor: pointer; padding: 15px; border-radius: 50%; font-size: 18px; line-height: 1; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">&#8679;</button>
<script>
window.addEventListener('scroll', function() {
  var btn = document.getElementById("scrollToTopBtn");
  if (btn) {
      if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
        btn.style.display = "block";
      } else {
        btn.style.display = "none";
      }
  }
});
var topBtn = document.getElementById('scrollToTopBtn');
if(topBtn) {
    topBtn.addEventListener('click', function(){
        window.scrollTo({top: 0, behavior: 'smooth'});
    });
}
</script>
</body>
</html>
