<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Skills</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .handle { 
            cursor: grab; 
            margin-right: 15px; 
            font-size: 1.2rem; 
            color: #888; 
            user-select: none;
        }
        .handle:active { cursor: grabbing; }
        .skill-card { transition: transform 0.2s, box-shadow 0.2s; }
        .ghost { opacity: 0.4; background: #e9ecef !important; border: 2px dashed #6c757d !important; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h3 class="mb-0">Manage Skills</h3>
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
            </div>
            <div class="card-body">
                
                <form method="POST" class="row g-3 mb-5 align-items-end">
                    <div class="col-md-6">
                        <label class="form-label">Skill Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Python, Leadership" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Level (1-100%)</label>
                        <input type="number" name="level" class="form-control" min="1" max="100" placeholder="80" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success w-100">Add Skill</button>
                    </div>
                </form>

                <hr>

                <h5 class="mb-3">Current Skills (Drag to Reorder)</h5>
                
                <div class="row sortable-list" data-model="skill">
                    {% for skill in skills %}
                    <div class="col-md-4 mb-3" data-id="{{ skill.id }}">
                        <div class="border rounded p-3 d-flex justify-content-between align-items-center bg-white skill-card shadow-sm">
                            <div class="d-flex align-items-center w-100">
                                <span class="handle">☰</span>
                                <div class="w-100">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <strong>{{ skill.name }}</strong>
                                        <span class="badge bg-light text-primary border">{{ skill.level }}%</span>
                                    </div>
                                    
                                    <div class="progress mt-2" style="width: 100%; height: 6px;">
                                        <div class="progress-bar bg-info" role="progressbar" style="width: {{ skill.level }}%"></div>
                                    </div>
                                </div>
                            </div>
                            <a href="{{ url_for('delete_skill', id=skill.id) }}" class="btn btn-sm btn-outline-danger ms-3" onclick="return confirm('Delete this skill?')">×</a>
                        </div>
                    </div>
                    {% endfor %}
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script>
        const container = document.querySelector('.sortable-list');
        if(container) {
            new Sortable(container, {
                handle: '.handle',
                animation: 150,
                ghostClass: 'ghost',
                onEnd: function (evt) {
                    const items = container.querySelectorAll('div[data-id]');
                    const orderList = Array.from(items).map(item => item.getAttribute('data-id'));
                    
                    fetch('/admin/reorder', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ model: 'skill', order: orderList })
                    });
                }
            });
        }
    </script>
<!-- Scroll to Top Button -->
<button id="scrollToTopBtn" title="Go to top" style="display: none; position: fixed; bottom: 20px; right: 20px; z-index: 9999; border: none; outline: none; background-color: #007bff; color: white; cursor: pointer; padding: 15px; border-radius: 50%; font-size: 18px; line-height: 1; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">&#8679;</button>
<script>
window.addEventListener('scroll', function() {
  var btn = document.getElementById("scrollToTopBtn");
  if (btn) {
      if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
        btn.style.display = "block";
      } else {
        btn.style.display = "none";
      }
  }
});
var topBtn = document.getElementById('scrollToTopBtn');
if(topBtn) {
    topBtn.addEventListener('click', function(){
        window.scrollTo({top: 0, behavior: 'smooth'});
    });
}
</script>
</body>
</html>
