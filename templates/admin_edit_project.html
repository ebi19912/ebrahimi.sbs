<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Edit' if project else 'New' }} Project</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.tiny.cloud/1/w8vr6yt43j2ye3rljgb50iljf8vpzb3iy2kclr4yc11xk5tb/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
    <script>
      tinymce.init({
        selector: '#full_content',
        plugins: 'advlist autolink lists link image media table code',
        toolbar: 'undo redo | formatselect | bold italic | alignleft aligncenter alignright | bullist numlist | link image | code',
        height: 400
      });
    </script>
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h3 class="mb-0">{{ 'Edit Project' if project else 'Create New Project' }}</h3>
                <a href="{{ url_for('admin_projects_list') }}" class="btn btn-outline-light btn-sm">Back to List</a>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    
                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label class="form-label fw-bold">Project Title</label>
                            <input type="text" name="title" class="form-control" value="{{ project.title if project else '' }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Status</label>
                            <select name="status" class="form-select">
                                <option value="ongoing" {% if project and project.status == 'ongoing' %}selected{% endif %}>Ongoing / In Progress</option>
                                <option value="completed" {% if project and project.status == 'completed' %}selected{% endif %}>Completed</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Short Description (Summary)</label>
                        <textarea name="short_description" class="form-control" rows="3">{{ project.short_description if project else '' }}</textarea>
                    </div>

                    <div class="card bg-light mb-3">
                        <div class="card-body">
                            <h5 class="card-title text-muted mb-3">Project Links (Optional)</h5>
                            <div class="row">
                                <div class="col-md-4 mb-2">
                                    <label class="form-label"><i class="bi bi-github"></i> GitHub Link</label>
                                    <input type="url" name="github_link" class="form-control" placeholder="https://github.com/..." value="{{ project.github_link if project else '' }}">
                                </div>
                                <div class="col-md-4 mb-2">
                                    <label class="form-label">📺 Video Demo Link</label>
                                    <input type="url" name="video_link" class="form-control" placeholder="https://youtube.com/..." value="{{ project.video_link if project else '' }}">
                                </div>
                                <div class="col-md-4 mb-2">
                                    <label class="form-label">🌐 Live Website Link</label>
                                    <input type="url" name="live_link" class="form-control" placeholder="https://mysite.com" value="{{ project.live_link if project else '' }}">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Documentation / Case Study</label>
                        <textarea id="full_content" name="full_content">{{ project.full_content if project else '' }}</textarea>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{{ url_for('admin_projects_list') }}" class="btn btn-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-primary px-5">Save Project</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
